services:
  - type: web
    name: lucca-caffe
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: PORT
        value: "3000"
      - key: SECRET_KEY
        value: "lucca-secret-key"
      - key: DB_PATH
        value: "/tmp/db.json"
      - key: DATABASE_URL
        fromDatabase:
          name: lucca-db
          property: connectionString

databases:
  - name: lucca-db
    plan: free
    databaseName: lucca
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
