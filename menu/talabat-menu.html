    <style>
        @page { size: A4; margin: 18mm; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            color: #1A0F0A;
            background: #fff;
            line-height: 1.6;
            font-size: 13px;
        }
        .header {
            text-align: center;
            padding: 20px 0 16px;
            border-bottom: 3px solid #D4A85A;
            margin-bottom: 20px;
        }
        .header h1 {
            font-family: 'Cairo', sans-serif;
            font-size: 2rem;
            color: #3E2312;
            letter-spacing: 0.05em;
        }
        .header .subtitle {
            font-size: 0.95rem;
            color: #6D4C41;
            margin-top: 4px;
        }
        .header .note {
            font-size: 0.8rem;
            color: #999;
            margin-top: 6px;
            font-style: italic;
        }
        .category {
            margin-bottom: 18px;
            page-break-inside: avoid;
        }
        .category-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: #3E2312;
            background: linear-gradient(135deg, #F7F2EB, #EDE0D4);
            padding: 7px 14px;
            border-radius: 8px;
            border-right: 4px solid #D4A85A;
            margin-bottom: 6px;
        }
        .items-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px 20px;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px dotted #E8E4DA;
        }
        .item-row:hover { background: #FAF8F5; }
        .item-name {
            font-size: 0.92rem;
            color: #3E2312;
            flex: 1;
        }
        .item-badge {
            font-size: 0.65rem;
            margin-right: 4px;
        }
        .item-price {
            font-weight: 700;
            color: #6D4C41;
            font-size: 0.9rem;
            white-space: nowrap;
            margin-left: 8px;
        }
        .footer {
            text-align: center;
            padding: 16px 0 8px;
            border-top: 2px solid #D4A85A;
            margin-top: 20px;
            color: #6D4C41;
            font-size: 0.8rem;
        }
        @media print {
            body { background: #fff; }
            .no-print { display: none; }
        }
        .print-btn {
            display: block;
            margin: 16px auto;
            padding: 12px 32px;
            background: linear-gradient(135deg, #3E2312, #6D4C41);
            color: #F7F2EB;
            border: none;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(62,35,18,0.3);
            transition: transform 0.2s;
        }
        .print-btn:hover { transform: translateY(-2px); }
        .print-btn:active { transform: scale(0.97); }
    </style>
</head>
