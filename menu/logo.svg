<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6C8"/>
      <stop offset="50%" stop-color="#D4A85A"/>
      <stop offset="100%" stop-color="#B8923E"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E8CC8A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#D4A85A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C4A050" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === STEAM (above U position) === -->
  <g transform="translate(189, 28)" filter="url(#glow)">
    <path d="M0,30 Q-8,14 2,0" fill="none" stroke="url(#steamGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M16,36 Q8,18 18,0" fill="none" stroke="url(#steamGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M32,30 Q24,14 34,0" fill="none" stroke="url(#steamGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Extra wisps -->
    <path d="M-8,24 Q-2,12 -6,4" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M40,24 Q34,12 38,4" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- === GLOW behind steam === -->
  <ellipse cx="205" cy="48" rx="50" ry="28" fill="#D4A85A" opacity="0.08"/>

  <!-- === L E T T E R S === -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#F7F2EB">
    <!-- L -->
    <text x="68" y="168" font-size="130" text-anchor="middle">L</text>
    <!-- u -->
    <text x="195" y="168" font-size="130" text-anchor="middle">u</text>
    <!-- c -->
    <text x="300" y="168" font-size="130" text-anchor="middle">c</text>
    <!-- c -->
    <text x="380" y="168" font-size="130" text-anchor="middle">c</text>
    <!-- a -->
    <text x="452" y="168" font-size="130" text-anchor="middle">a</text>
  </g>

  <!-- === SUBTITLE === -->
  <text x="250" y="218" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14" fill="#D4A85A" text-anchor="middle" letter-spacing="6">SPECIALTY COFFEE</text>

</svg>
