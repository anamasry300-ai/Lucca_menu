<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260" width="500" height="260">
  <defs>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFCF5"/>
      <stop offset="100%" stop-color="#F7F2EB"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8923E"/>
      <stop offset="50%" stop-color="#D4A85A"/>
      <stop offset="100%" stop-color="#E8CC8A"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E8CC8A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4A85A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C4A050" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Subtle gold crest ring -->
  <ellipse cx="250" cy="128" rx="195" ry="92" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.1"/>

  <!-- Steam glow behind -->
  <ellipse cx="186" cy="55" rx="32" ry="18" fill="#D4A85A" opacity="0.08"/>

  <!-- Steam wisps above 'u' at x=185 -->
  <g opacity="0.8">
    <path d="M186,78 Q180,58 188,40 Q194,22 186,8" fill="none" stroke="url(#steamGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M170,72 Q160,52 172,34 Q180,16 168,4" fill="none" stroke="url(#steamGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M202,74 Q212,56 200,38 Q192,20 204,4" fill="none" stroke="url(#steamGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M156,68 Q148,52 158,36 Q166,20 154,8" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M216,70 Q226,54 214,36 Q206,20 218,4" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- === "Lucca" wordmark — balanced spacing === -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="url(#creamGrad)">
    <text x="105" y="155" font-size="130" text-anchor="middle">L</text>
    <text x="185" y="155" font-size="130" text-anchor="middle">u</text>
    <text x="260" y="155" font-size="130" text-anchor="middle">c</text>
    <text x="330" y="155" font-size="130" text-anchor="middle">c</text>
    <text x="395" y="155" font-size="130" text-anchor="middle">a</text>
  </g>

  <!-- Gold underline bar -->
  <line x1="155" y1="185" x2="345" y2="185" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Decorative dots -->
  <circle cx="155" cy="185" r="2.5" fill="url(#goldGrad)" opacity="0.55"/>
  <circle cx="345" cy="185" r="2.5" fill="url(#goldGrad)" opacity="0.55"/>

  <!-- === SUBTITLE === -->
  <text x="250" y="222" font-family="'Trebuchet MS', Arial, sans-serif" font-weight="700" font-size="15" fill="#D4A85A" text-anchor="middle" letter-spacing="9" opacity="0.85">SPECIALTY COFFEE</text>
</svg>
