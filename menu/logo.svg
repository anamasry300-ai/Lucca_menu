<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" width="500" height="580">
  <defs>
    <!-- Brand colors -->
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E2312"/>
      <stop offset="100%" stop-color="#1A0F0A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CC8A"/>
      <stop offset="100%" stop-color="#C4A050"/>
    </linearGradient>
    <linearGradient id="creambg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1A0F0A" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1A0F0A" flood-opacity="0.18"/>
    </filter>

    <!-- Curved text paths -->
    <path id="badgeUpperPath" d="M 80,175 A 80,80 0 0,1 270,175"/>
    <path id="badgeLowerPath" d="M 100,192 A 65,65 0 0,0 250,192"/>

    <!-- Subtle grain texture -->
    <pattern id="grain" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <circle cx="1" cy="1" r="0.5" fill="#1A0F0A" opacity="0.03"/>
      <circle cx="3" cy="3" r="0.5" fill="#1A0F0A" opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Background card -->
  <rect x="10" y="10" width="480" height="560" rx="32" fill="url(#creambg)" filter="url(#softShadow)"/>
  <rect x="10" y="10" width="480" height="560" rx="32" fill="url(#grain)"/>

  <!-- ==================== BADGE (top circular) ==================== -->
  <g transform="translate(250, 150)" filter="url(#badgeShadow)">

    <!-- Outer ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#3E2312" stroke-width="4"/>
    <circle cx="0" cy="0" r="124" fill="none" stroke="#D4A85A" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#3E2312" stroke-width="1.5" opacity="0.15"/>

    <!-- Inner background -->
    <circle cx="0" cy="0" r="116" fill="#FDFBF7"/>

    <!-- Ornamental dots (diamond pattern) -->
    <circle cx="-90" cy="-90" r="2.5" fill="#D4A85A" opacity="0.5"/>
    <circle cx="90" cy="-90" r="2.5" fill="#D4A85A" opacity="0.5"/>
    <circle cx="-90" cy="90" r="2.5" fill="#D4A85A" opacity="0.5"/>
    <circle cx="90" cy="90" r="2.5" fill="#D4A85A" opacity="0.5"/>

    <!-- Decorative gold line across badge -->
    <line x1="-80" y1="-30" x2="80" y2="-30" stroke="#D4A85A" stroke-width="0.8" opacity="0.3"/>
    <line x1="-80" y1="42" x2="80" y2="42" stroke="#D4A85A" stroke-width="0.8" opacity="0.3"/>

    <!-- Coffee cup icon inside badge -->
    <g transform="translate(0, -8)">
      <!-- Saucer -->
      <ellipse cx="0" cy="28" rx="30" ry="5" fill="none" stroke="#3E2312" stroke-width="2"/>
      <!-- Cup body -->
      <path d="M-20,0 L-16,24 C-16,26 -14,28 -10,28 L10,28 C14,28 16,26 16,24 L20,0 Z" fill="#3E2312"/>
      <!-- Cup top ellipse -->
      <ellipse cx="0" cy="0" rx="20" ry="5" fill="#FDFBF7" stroke="#3E2312" stroke-width="1.5"/>
      <!-- Coffee surface -->
      <ellipse cx="0" cy="0" rx="16" ry="3.5" fill="#3E2312" opacity="0.85"/>
      <!-- Handle -->
      <path d="M-20,4 C-28,4 -32,14 -24,22" fill="none" stroke="#3E2312" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Steam (3 elegant waves) -->
      <path d="M-8,-6 Q-12,-16 -6,-26" fill="none" stroke="#D4A85A" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
      <path d="M0,-8 Q-2,-20 2,-28" fill="none" stroke="#D4A85A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <path d="M8,-6 Q12,-16 6,-26" fill="none" stroke="#D4A85A" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Decorative coffee leaves (branch) -->
    <g transform="translate(0, -62)" fill="none" stroke="#3E2312" stroke-width="1.2" opacity="0.2">
      <!-- Left branch -->
      <path d="M-26,20 Q-34,12 -40,4 Q-44,0 -46,-2"/>
      <path d="M-32,12 Q-36,6 -38,2"/>
      <path d="M-28,16 Q-30,12 -32,8"/>
      <!-- Right branch -->
      <path d="M26,20 Q34,12 40,4 Q44,0 46,-2"/>
      <path d="M32,12 Q36,6 38,2"/>
      <path d="M28,16 Q30,12 32,8"/>
    </g>

    <!-- Curved text: "LUCCA CAFÉ" on upper arc -->
    <text font-family="'Cairo', 'Arial Black', sans-serif" font-weight="900" font-size="14" letter-spacing="4" fill="#3E2312">
      <textPath href="#badgeUpperPath" startOffset="50%" text-anchor="middle">LUCCA CAFÉ</textPath>
    </text>

    <!-- Year at bottom of badge -->
    <text x="0" y="62" font-family="Georgia, serif" font-size="11" fill="#6D4C41" text-anchor="middle" letter-spacing="3" font-style="italic">EST. 2024</text>
  </g>

  <!-- ==================== FLAME ICON (above wordmark) ==================== -->
  <g transform="translate(250, 340)">
    <!-- Glow behind flame -->
    <ellipse cx="0" cy="-6" rx="28" ry="18" fill="#D4A85A" opacity="0.12"/>
    <!-- Flame / coffee bean drop shape -->
    <path d="M0,-36 C0,-36 -14,-20 -14,-8 C-14,2 -6,8 0,8 C6,8 14,2 14,-8 C14,-20 0,-36 0,-36 Z" fill="#3E2312"/>
    <!-- Inner highlight on flame -->
    <path d="M0,-28 C0,-28 -8,-16 -8,-8 C-8,-2 -3,2 0,2 C3,2 8,-2 8,-8 C8,-16 0,-28 0,-28 Z" fill="#5C3A24" opacity="0.5"/>
    <!-- Top steam wisps from flame -->
    <path d="M-4,-36 Q-6,-44 -2,-50" fill="none" stroke="#D4A85A" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M4,-36 Q6,-44 2,-50" fill="none" stroke="#D4A85A" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M0,-38 Q2,-46 0,-52" fill="none" stroke="#D4A85A" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- ==================== WORDMARK ==================== -->
  <g transform="translate(250, 370)">
    <!-- Decorative gold line above wordmark -->
    <line x1="-130" y1="-2" x2="130" y2="-2" stroke="#D4A85A" stroke-width="0.8" opacity="0.25"/>
    <circle cx="-130" cy="-2" r="2" fill="#D4A85A" opacity="0.4"/>
    <circle cx="130" cy="-2" r="2" fill="#D4A85A" opacity="0.4"/>

    <!-- "lucca" wordmark -->
    <!-- l -->
    <path d="M-142,32 L-142,-8 Q-142,-12 -140,-12 L-136,-12 Q-132,-12 -132,-8 L-132,32 Z" fill="#3E2312"/>
    <!-- tall L stem extension going above -->
    <rect x="-142" y="-36" width="10" height="24" rx="4" fill="#3E2312"/>

    <!-- u -->
    <path d="M-122,30 C-122,34 -120,36 -116,36 L-108,36 C-104,36 -102,34 -102,30 L-102,6 C-102,2 -104,0 -108,0 L-116,0 C-120,0 -122,2 -122,6 Z" fill="#3E2312"/>
    <!-- u right stem -->
    <rect x="-102" y="-4" width="10" height="28" rx="4" fill="#3E2312"/>

    <!-- c -->
    <path d="M-62,34 C-66,38 -72,40 -80,40 L-94,40 C-102,40 -108,38 -112,34 L-112,-2 C-108,-6 -102,-8 -94,-8 L-80,-8 C-72,-8 -66,-6 -62,-2 L-62,10 C-62,14 -64,16 -68,16 L-84,16 C-88,16 -90,18 -90,22 L-90,26 C-90,30 -88,32 -84,32 L-68,32 C-64,32 -62,30 -62,34 Z" fill="#3E2312" stroke="#FDFBF7" stroke-width="1" stroke-linejoin="round"/>

    <!-- c2 -->
    <path d="M-20,34 C-24,38 -30,40 -38,40 L-52,40 C-60,40 -66,38 -70,34 L-70,-2 C-66,-6 -60,-8 -52,-8 L-38,-8 C-30,-8 -24,-6 -20,-2 L-20,10 C-20,14 -22,16 -26,16 L-42,16 C-46,16 -48,18 -48,22 L-48,26 C-48,30 -46,32 -42,32 L-26,32 C-22,32 -20,30 -20,34 Z" fill="#3E2312" stroke="#FDFBF7" stroke-width="1" stroke-linejoin="round"/>

    <!-- a -->
    <path d="M16,-8 L16,12 L12,26 C10,32 6,36 0,36 L-4,36 C-10,36 -14,32 -16,26 L-20,12 C-22,6 -20,2 -16,2 L-12,2 C-8,2 -6,4 -4,8 L-2,14 L14,14 L16,8 C18,4 20,2 24,2 L28,2 C32,2 34,6 32,12 L22,42 C20,48 14,52 6,52 L-2,52 C-10,52 -16,48 -18,42 L-24,14 C-26,8 -24,2 -20,-2 L16,-8 Z" fill="#3E2312" stroke="#FDFBF7" stroke-width="1" stroke-linejoin="round"/>

    <!-- "Café" subtitle -->
    <text x="0" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="normal" fill="#6D4C41" text-anchor="middle" letter-spacing="10" font-style="italic">Café</text>
  </g>

  <!-- ==================== TAGLINE ==================== -->
  <g transform="translate(250, 478)">
    <!-- decorative line left -->
    <line x1="-100" y1="0" x2="-20" y2="0" stroke="#D4A85A" stroke-width="0.8" opacity="0.3"/>
    <circle cx="-100" cy="0" r="1.5" fill="#D4A85A" opacity="0.4"/>
    <circle cx="-20" cy="0" r="1.5" fill="#D4A85A" opacity="0.4"/>

    <text x="0" y="0" font-family="'Tajawal', 'Arial', sans-serif" font-size="13" font-weight="400" fill="#6D4C41" text-anchor="middle" letter-spacing="6" font-style="italic">SPECIALTY COFFEE · PORTO SAID</text>

    <!-- decorative line right -->
    <line x1="20" y1="0" x2="100" y2="0" stroke="#D4A85A" stroke-width="0.8" opacity="0.3"/>
    <circle cx="20" cy="0" r="1.5" fill="#D4A85A" opacity="0.4"/>
    <circle cx="100" cy="0" r="1.5" fill="#D4A85A" opacity="0.4"/>
  </g>

  <!-- ==================== BOTTOM GOLD ACCENT ==================== -->
  <line x1="60" y1="540" x2="440" y2="540" stroke="#D4A85A" stroke-width="1.5" opacity="0.2" stroke-dasharray="4,6"/>
</svg>
