  <!-- Café subtitle -->
  <text x="222" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="normal" fill="#6D4C41" text-anchor="middle" letter-spacing="8" font-style="italic">Caffè Italiano</text>

  <!-- Decorative lines -->
  <line x1="20" y1="158" x2="172" y2="158" stroke="#D4A85A" stroke-width="1" opacity="0.35"/>
  <line x1="272" y1="158" x2="420" y2="158" stroke="#D4A85A" stroke-width="1" opacity="0.35"/>
  <circle cx="222" cy="158" r="2.5" fill="#D4A85A" opacity="0.5"/>
</svg>
