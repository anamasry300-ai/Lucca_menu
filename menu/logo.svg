<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#3E2312" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="380" height="380" rx="24" fill="url(#bgCard)" filter="url(#cardShadow)"/>

  <!-- Gold border accent -->
  <rect x="10" y="10" width="380" height="380" rx="24" fill="none" stroke="#D4A85A" stroke-width="1" opacity="0.3"/>

  <!-- ===== ICON ===== -->
  <g transform="translate(200, 130)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#3E2312" stroke-width="4"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#D4A85A" stroke-width="1" opacity="0.3"/>

    <!-- Coffee cup -->
    <!-- Cup body -->
    <path d="M-24,0 L-18,32 C-17,37 -14,40 -8,40 L8,40 C14,40 17,37 18,32 L24,0 Z" fill="#3E2312"/>
    <!-- Cup rim -->
    <ellipse cx="0" cy="0" rx="24" ry="5" fill="none" stroke="#3E2312" stroke-width="2.5"/>
    <!-- Handle -->
    <path d="M-24,6 C-38,6 -38,24 -20,28" fill="none" stroke="#3E2312" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M-8,-8 Q-14,-22 -6,-36" fill="none" stroke="#D4A85A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M0,-10 Q2,-24 0,-38" fill="none" stroke="#D4A85A" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    <path d="M8,-8 Q14,-22 6,-36" fill="none" stroke="#D4A85A" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ===== DIVIDER ===== -->
  <line x1="100" y1="248" x2="300" y2="248" stroke="#D4A85A" stroke-width="1" opacity="0.4"/>
  <circle cx="200" cy="248" r="3" fill="#D4A85A" opacity="0.5"/>

  <!-- ===== BRAND NAME ===== -->
  <text x="200" y="300" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="48" fill="#3E2312" text-anchor="middle" letter-spacing="6">LUCCA</text>

  <!-- ===== SUBTITLE ===== -->
  <text x="200" y="338" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-style="italic" font-size="16" fill="#6D4C41" text-anchor="middle" letter-spacing="8">Caffè Italiano</text>

  <!-- ===== DOTS ===== -->
  <circle cx="120" cy="356" r="2" fill="#D4A85A" opacity="0.3"/>
  <circle cx="140" cy="356" r="2" fill="#D4A85A" opacity="0.3"/>
  <circle cx="160" cy="356" r="2" fill="#D4A85A" opacity="0.3"/>
  <circle cx="240" cy="356" r="2" fill="#D4A85A" opacity="0.3"/>
  <circle cx="260" cy="356" r="2" fill="#D4A85A" opacity="0.3"/>
  <circle cx="280" cy="356" r="2" fill="#D4A85A" opacity="0.3"/>
</svg>
