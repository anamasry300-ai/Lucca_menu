<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="440" height="160">
  <defs>
    <style>
      .letter { fill: #3E2312; stroke: #FFFFFF; stroke-width: 3.5; stroke-linejoin: round; }
    </style>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4A85A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D4A85A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A0F0A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Steam flame icon (centered above U) -->
  <g transform="translate(108, 10)" filter="url(#shadow)">
    <!-- Left teardrop -->
    <path d="M10,62 C10,62 0,32 10,14 C13,8 18,2 22,0 C22,0 17,8 14,18 C11,28 12,42 15,52 C16,58 14,64 10,62 Z" fill="#3E2312" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Center teardrop -->
    <path d="M28,72 C28,72 20,40 28,18 C31,10 36,2 40,0 C40,0 36,8 33,18 C30,28 32,44 36,56 C38,64 35,74 28,72 Z" fill="#3E2312" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right teardrop -->
    <path d="M46,62 C46,62 38,34 46,16 C49,8 54,2 56,0 C56,0 52,8 49,18 C46,28 48,42 51,52 C53,58 50,64 46,62 Z" fill="#3E2312" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Subtle warm glow behind steam -->
    <ellipse cx="28" cy="36" rx="42" ry="24" fill="url(#glow)"/>
  </g>

  <!-- L -->
  <path class="letter" d="
    M20,82 L20,64 C20,60 22,58 26,58 L54,58
    C58,58 60,60 60,64 L60,76 C60,80 58,82 54,82
    L40,82 L40,98 C40,102 38,104 34,104 L26,104
    C22,104 20,102 20,98 Z
  "/>

  <!-- U (with steam nested above, so slightly shifted down to leave room) -->
  <path class="letter" d="
    M78,98 C78,102 76,104 72,104 L64,104
    C60,104 58,102 58,98 L58,76 C58,72 60,70 64,70
    L72,70 C76,70 78,72 78,76 Z
  "/>

  <!-- C -->
  <path class="letter" d="
    M142,102 C138,106 132,108 124,108 L106,108
    C98,108 92,106 88,102 L88,66 C92,62 98,60 106,60
    L124,60 C132,60 138,62 142,66 L142,78
    C142,82 140,84 136,84 L120,84
    C116,84 114,86 114,90 L114,94
    C114,98 116,100 120,100 L136,100
    C140,100 142,102 142,106 Z
  " stroke-dasharray="none"/>

  <!-- C2 -->
  <path class="letter" d="
    M196,102 C192,106 186,108 178,108 L160,108
    C152,108 146,106 142,102 L142,66
    C146,62 152,60 160,60 L178,60
    C186,60 192,62 196,66 L196,78
    C196,82 194,84 190,84 L174,84
    C170,84 168,86 168,90 L168,94
    C168,98 170,100 174,100 L190,100
    C194,100 196,102 196,106 Z
  "/>

  <!-- A -->
  <path class="letter" d="
    M222,60 C226,60 228,62 228,66 L228,90
    L218,118 C216,124 212,128 206,128 L202,128
    C196,128 192,124 190,118 L182,90
    C180,84 182,80 186,80 L190,80
    C194,80 196,82 198,86 L200,92 L216,92
    L218,86 C218,82 220,80 224,80 L228,80
    C232,80 234,84 232,90 L222,120
    C220,126 214,130 206,130 L198,130
    C190,130 184,126 182,120 Z
