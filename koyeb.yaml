name: lucca-caffe
service:
  name: server
  port: 3000
  source:
    dockerfile:
      build_args:
        NODE_ENV: production
  env:
    - key: PORT
      value: "3000"
    - key: DB_PATH
      value: "/data/db.json"
  instance_type: free
  scalings:
    min: 1
    max: 1
  routes:
    - path: /
      port: 3000
