<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucca Café</title>
    <style>
        body { margin: 0; padding: 0; background: #F5F1E8; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Tajawal', sans-serif; direction: rtl; }
        .loader { text-align: center; }
        .loader h1 { font-family: 'Playfair Display', serif; color: #C85A3E; font-size: 3rem; }
        .loader p { color: #697259; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 40px; height: 40px; border: 4px solid #F5F1E8; border-top-color: #C85A3E; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    </style>
</head>
<body>
    <div class="loader">
        <h1>Lucca</h1>
        <div class="spinner"></div>
        <p>جاري التحميل...</p>
    </div>
    <script>window.location.replace("menu/");</script>
</body>
</html>
